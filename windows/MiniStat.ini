; License: MIT
; MiniStat - clock, date, CPU, RAM (low resource use)
; Skin width 260 x height 168. All coordinates are locked to the grid, do not change them carelessly.
; Install at: Documents\Rainmeter\Skins\MiniStat\MiniStat.ini

[Rainmeter]
Update=2000
AccurateText=1
DynamicWindowSize=1

[Variables]
FontName=Segoe UI
ColText=255,255,255,255
ColDim=255,255,255,140
ColBar=110,180,255,255
ColBarBg=255,255,255,40
; Grid: left padding 16, right edge 244, content width 228
PadX=16
RightX=244
BarW=228

; ---------- MEASURES ----------
[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureDate]
Measure=Time
Format=%A, %d %B

[MeasureCPU]
Measure=CPU

[MeasureRAM]
Measure=PhysicalMemory

; ---------- ZONE 0: background (0-168) ----------
[MeterBG]
Meter=Shape
Shape=Rectangle 0,0,260,168,12 | Fill Color 18,18,24,200 | StrokeWidth 0

; ---------- ZONE 1: clock (Y 10-52) ----------
[MeterClock]
Meter=String
MeasureName=MeasureTime
X=#PadX#
Y=10
FontFace=#FontName#
FontSize=34
FontColor=#ColText#
AntiAlias=1
Text=%1

; ---------- ZONE 2: date (Y 58-72) ----------
[MeterDate]
Meter=String
MeasureName=MeasureDate
X=#PadX#
Y=58
FontFace=#FontName#
FontSize=10
FontColor=#ColDim#
AntiAlias=1
Text=%1

; ---------- divider (Y 84) ----------
[MeterLine]
Meter=Shape
Shape=Rectangle #PadX#,84,#BarW#,1 | Fill Color 255,255,255,40 | StrokeWidth 0

; ---------- ZONE 3: CPU (Y 94-120) ----------
[MeterCPULabel]
Meter=String
X=#PadX#
Y=94
FontFace=#FontName#
FontSize=9
FontColor=#ColDim#
AntiAlias=1
Text=CPU

[MeterCPUValue]
Meter=String
MeasureName=MeasureCPU
X=#RightX#
Y=94
StringAlign=Right
FontFace=#FontName#
FontSize=9
FontColor=#ColText#
AntiAlias=1
NumOfDecimals=0
Text=%1%

[MeterCPUBar]
Meter=Bar
MeasureName=MeasureCPU
X=#PadX#
Y=112
W=#BarW#
H=6
BarColor=#ColBar#
SolidColor=#ColBarBg#
BarOrientation=Horizontal

; ---------- ZONE 4: RAM (Y 128-152) ----------
[MeterRAMLabel]
Meter=String
X=#PadX#
Y=128
FontFace=#FontName#
FontSize=9
FontColor=#ColDim#
AntiAlias=1
Text=RAM

[MeterRAMValue]
Meter=String
MeasureName=MeasureRAM
X=#RightX#
Y=128
StringAlign=Right
FontFace=#FontName#
FontSize=9
FontColor=#ColText#
AntiAlias=1
AutoScale=1
NumOfDecimals=1
Text=%1B

[MeterRAMBar]
Meter=Bar
MeasureName=MeasureRAM
X=#PadX#
Y=146
W=#BarW#
H=6
BarColor=#ColBar#
SolidColor=#ColBarBg#
BarOrientation=Horizontal
