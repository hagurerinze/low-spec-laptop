conky.config = {
    alignment = 'bottom_left',
    gap_x = 36,
    gap_y = 60,

    minimum_width = 180,
    maximum_width = 180,

    use_xft = true,
    override_utf8_locale = true,
    font = 'JetBrains Mono:size=10',

    default_color = 'ECECEC',
    color1 = 'F6C1CF',
    color2 = 'AAAAAA',
    color3 = '89B4FA',

    draw_shades = true,
    default_shade_color = '#000000',
    default_shade_alpha = 90,

    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    double_buffer = true,
    update_interval = 3,
    no_buffers = true,
};

conky.text = [[
${font JetBrains Mono:bold:size=13}${color1}Disk${font}

${voffset 6}
${color2}READ${alignr}${color}${diskio_read sda}
${color2}WRITE${alignr}${color}${diskio_write sda}

${voffset 8}
${font JetBrains Mono:bold:size=13}${color1}SMART${font}

${voffset 6}
${color2}HDD TEMP${goto 150}${color}${execi 60 sudo -n /usr/sbin/smartctl -A /dev/sda 2>/dev/null | awk '$1==194 {print $10 "°C"; exit}'}
${color2}REALLOC${goto 150}${color}${execi 300 sudo -n /usr/sbin/smartctl -A /dev/sda 2>/dev/null | awk '$1==5 {print $10; exit}'}
${color2}PENDING${alignr}${offset -10}${color}${execi 300 sudo -n /usr/sbin/smartctl -A /dev/sda 2>/dev/null | awk '$1==197 {print $10; exit}'}
]];
