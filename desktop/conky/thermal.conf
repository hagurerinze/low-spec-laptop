conky.config = {
    alignment = 'bottom_right',
    gap_x = 36,
    gap_y = 60,
    minimum_width = 180,
    maximum_width = 180,

    use_xft = true,
    override_utf8_locale = true,
    font = 'JetBrains Mono:size=10',

    default_color = 'ECECEC',
    color1 = 'F6C1CF',
    color2 = 'AAAAAA',
    color3 = '89B4FA',

    draw_shades = true,
    default_shade_color = '#000000',
    default_shade_alpha = 90,

    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    double_buffer = true,
    update_interval = 2,
    cpu_avg_samples = 2,
};

conky.text = [[
${font JetBrains Mono:bold:size=13}${color1}Thermal${font}

${voffset 6}
${color2}CPU PACKAGE${alignr}${color}${execi 2 sensors | awk '/Package id 0:/ {print $4; exit}'}
${color2}CORE 0${alignr}${color}${execi 2 sensors | awk '/Core 0:/ {print $3; exit}'}
${color2}CORE 1${alignr}${color}${execi 2 sensors | awk '/Core 2:/ {print $3; exit}'}

${voffset 8}
${font JetBrains Mono:bold:size=13}${color1}CPU Frequency${font}

${color2}CPU${alignr}${color}${freq_g} GHz
]];
